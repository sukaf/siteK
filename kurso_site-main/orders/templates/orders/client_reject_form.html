{% extends 'base.html' %}

{% block content %}
  <h2>Отклонить заказ №{{ order.id }}</h2>
  <form method="post">
    {% csrf_token %}
    <div>
      <label for="comment">Комментарий:</label>
      <textarea name="comment" id="comment" rows="4" required></textarea>
    </div>
    <button type="submit">Отклонить заказ и создать спор</button>
  </form>
{% endblock %}
